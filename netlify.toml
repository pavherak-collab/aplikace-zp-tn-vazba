[build]
  command = "pnpm --filter @workspace/lunch-feedback build"
  publish = "artifacts/lunch-feedback/dist/public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["netlify/functions/data/*.ttf"]

[functions."menu-sync"]
  external_node_modules = [
    "node-html-parser",
    "pino",
    "drizzle-orm",
    "pg",
    "drizzle-zod",
    "zod",
  ]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
