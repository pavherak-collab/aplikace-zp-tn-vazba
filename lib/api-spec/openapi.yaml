openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: feedback
    description: Lunch feedback operations
  - name: menus
    description: Daily meal menu operations
  - name: reports
    description: Weekly report operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /feedback:
    post:
      operationId: createFeedback
      tags: [feedback]
      summary: Submit lunch feedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFeedbackInput"
      responses:
        "201":
          description: Feedback submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feedback"
    get:
      operationId: listFeedback
      tags: [feedback]
      summary: List all feedback
      parameters:
        - name: meal
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of feedback
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Feedback"

  /feedback/weekly-report:
    get:
      operationId: getWeeklyReport
      tags: [feedback]
      summary: Get aggregated weekly feedback report
      responses:
        "200":
          description: Weekly report data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyReport"

  /feedback/stats:
    get:
      operationId: getFeedbackStats
      tags: [feedback]
      summary: Get aggregated feedback stats per meal
      parameters:
        - name: date
          in: query
          required: false
          description: "Limit statistics to a specific date in YYYY-MM-DD format"
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Stats per meal
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MealStats"

  /menus:
    get:
      operationId: getMenus
      tags: [menus]
      summary: Get meal menus for a specific date
      parameters:
        - name: date
          in: query
          required: false
          description: "Date in YYYY-MM-DD format, defaults to today"
          schema:
            type: string
      responses:
        "200":
          description: Menu items for the date
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuItem"

  /menus/sync:
    post:
      operationId: syncMenus
      tags: [menus]
      summary: Trigger menu sync from Strava.cz
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"

  /menus/sync-log:
    get:
      operationId: getMenusSyncLog
      tags: [menus]
      summary: Get recent menu sync log entries
      responses:
        "200":
          description: Recent sync log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SyncLogEntry"

  /menus/{id}:
    delete:
      operationId: deleteMenu
      tags: [menus]
      summary: Delete a menu item by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        "404":
          description: Menu item not found

  /menus/upsert:
    post:
      operationId: upsertMenu
      tags: [menus]
      summary: Manually create or update a menu item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertMenuInput"
      responses:
        "200":
          description: Created or updated menu item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"

  /reports/weekly:
    get:
      operationId: listWeeklyReports
      tags: [reports]
      summary: List all stored weekly reports
      responses:
        "200":
          description: List of weekly reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StoredWeeklyReport"

  /reports/weekly/generate:
    post:
      operationId: generateWeeklyReport
      tags: [reports]
      summary: Manually trigger weekly report generation for current week
      responses:
        "200":
          description: Generated report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoredWeeklyReport"

  /email/settings:
    get:
      operationId: getEmailSettings
      tags: [email]
      summary: Get current email notification settings
      responses:
        "200":
          description: Current email settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailSettings"
    put:
      operationId: updateEmailSettings
      tags: [email]
      summary: Update email notification settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEmailSettingsInput"
      responses:
        "200":
          description: Updated email settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailSettings"

  /email/send-test:
    post:
      operationId: sendTestEmail
      tags: [email]
      summary: Send a test email to configured recipients
      responses:
        "200":
          description: Send result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendEmailResult"

  /email/send-report:
    post:
      operationId: sendReportEmail
      tags: [email]
      summary: Send the latest weekly report email now
      responses:
        "200":
          description: Send result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendEmailResult"

  /email/logs:
    get:
      operationId: getEmailLogs
      tags: [email]
      summary: Get recent email delivery log entries
      responses:
        "200":
          description: Recent email logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmailLog"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    CreateFeedbackInput:
      type: object
      properties:
        meal:
          type: string
          description: "Meal identifier, e.g. 'obed1' or 'obed2'"
        rating:
          type: string
          enum: [positive, neutral, negative]
        comment:
          type: string
          nullable: true
      required:
        - meal
        - rating

    Feedback:
      type: object
      properties:
        id:
          type: integer
        meal:
          type: string
        mealName:
          type: string
          nullable: true
        rating:
          type: string
          enum: [positive, neutral, negative]
        comment:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - meal
        - mealName
        - rating
        - createdAt

    WeeklyReportComment:
      type: object
      properties:
        meal:
          type: string
        mealName:
          type: string
          nullable: true
        rating:
          type: string
          enum: [positive, neutral, negative]
        comment:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - meal
        - mealName
        - rating
        - comment
        - createdAt

    WeeklyReport:
      type: object
      properties:
        totalThisWeek:
          type: integer
        positivePercent:
          type: number
        neutralPercent:
          type: number
        negativePercent:
          type: number
        bestMeal:
          type: string
          nullable: true
        worstMeal:
          type: string
          nullable: true
        recentComments:
          type: array
          items:
            $ref: "#/components/schemas/WeeklyReportComment"
        mealBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/MealStats"
      required:
        - totalThisWeek
        - positivePercent
        - neutralPercent
        - negativePercent
        - bestMeal
        - worstMeal
        - recentComments
        - mealBreakdown

    MealStats:
      type: object
      properties:
        meal:
          type: string
        positive:
          type: integer
        neutral:
          type: integer
        negative:
          type: integer
        total:
          type: integer
      required:
        - meal
        - positive
        - neutral
        - negative
        - total

    MenuItem:
      type: object
      properties:
        id:
          type: integer
        date:
          type: string
        mealType:
          type: string
        name:
          type: string
        syncedAt:
          type: string
          format: date-time
      required:
        - id
        - date
        - mealType
        - name
        - syncedAt

    SyncResult:
      type: object
      properties:
        synced:
          type: integer
        message:
          type: string
      required:
        - synced
        - message

    TopComment:
      type: object
      properties:
        text:
          type: string
        count:
          type: integer
        meal:
          type: string
      required:
        - text
        - count
        - meal

    StoredMealBreakdown:
      type: object
      properties:
        meal:
          type: string
        positive:
          type: integer
        neutral:
          type: integer
        negative:
          type: integer
        total:
          type: integer
      required:
        - meal
        - positive
        - neutral
        - negative
        - total

    EmailSettings:
      type: object
      properties:
        id:
          type: integer
        recipients:
          type: string
        fromAddress:
          type: string
        enabled:
          type: boolean
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - recipients
        - fromAddress
        - enabled
        - updatedAt

    UpdateEmailSettingsInput:
      type: object
      properties:
        recipients:
          type: string
        fromAddress:
          type: string
        enabled:
          type: boolean

    SendEmailResult:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        error:
          type: string
          nullable: true
      required:
        - success
        - message

    EmailLog:
      type: object
      properties:
        id:
          type: integer
        sentAt:
          type: string
          format: date-time
        recipients:
          type: string
        status:
          type: string
        error:
          type: string
          nullable: true
        weekStart:
          type: string
          nullable: true
      required:
        - id
        - sentAt
        - recipients
        - status

    SyncLogEntry:
      type: object
      properties:
        id:
          type: integer
        triggeredAt:
          type: string
          format: date-time
        source:
          type: string
        synced:
          type: integer
        error:
          type: string
          nullable: true
      required:
        - id
        - triggeredAt
        - source
        - synced

    UpsertMenuInput:
      type: object
      properties:
        date:
          type: string
        mealType:
          type: string
        name:
          type: string
      required:
        - date
        - mealType
        - name

    DeleteResult:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success

    StoredWeeklyReport:
      type: object
      properties:
        id:
          type: integer
        weekStart:
          type: string
        totalFeedback:
          type: integer
        positiveCount:
          type: integer
        neutralCount:
          type: integer
        negativeCount:
          type: integer
        bestMeal:
          type: string
          nullable: true
        worstMeal:
          type: string
          nullable: true
        topComments:
          type: array
          items:
            $ref: "#/components/schemas/TopComment"
        mealBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/StoredMealBreakdown"
        generatedAt:
          type: string
          format: date-time
      required:
        - id
        - weekStart
        - totalFeedback
        - positiveCount
        - neutralCount
        - negativeCount
        - topComments
        - mealBreakdown
        - generatedAt
