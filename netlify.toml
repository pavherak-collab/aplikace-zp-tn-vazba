[build]
  command = "pnpm --filter @workspace/lunch-feedback build"
  publish = "artifacts/lunch-feedback/dist/public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["express", "pino", "pino-http", "cors", "serverless-http"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
