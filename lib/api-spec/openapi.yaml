openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: feedback
    description: Lunch feedback operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /feedback:
    post:
      operationId: createFeedback
      tags: [feedback]
      summary: Submit lunch feedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFeedbackInput"
      responses:
        "201":
          description: Feedback submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feedback"
    get:
      operationId: listFeedback
      tags: [feedback]
      summary: List all feedback
      parameters:
        - name: meal
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of feedback
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Feedback"

  /feedback/weekly-report:
    get:
      operationId: getWeeklyReport
      tags: [feedback]
      summary: Get aggregated weekly feedback report
      responses:
        "200":
          description: Weekly report data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyReport"

  /feedback/stats:
    get:
      operationId: getFeedbackStats
      tags: [feedback]
      summary: Get aggregated feedback stats per meal
      responses:
        "200":
          description: Stats per meal
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MealStats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    CreateFeedbackInput:
      type: object
      properties:
        meal:
          type: string
          description: "Meal identifier, e.g. 'obed1' or 'obed2'"
        rating:
          type: string
          enum: [positive, neutral, negative]
        comment:
          type: string
          nullable: true
      required:
        - meal
        - rating

    Feedback:
      type: object
      properties:
        id:
          type: integer
        meal:
          type: string
        rating:
          type: string
          enum: [positive, neutral, negative]
        comment:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - meal
        - rating
        - createdAt

    WeeklyReportComment:
      type: object
      properties:
        meal:
          type: string
        rating:
          type: string
          enum: [positive, neutral, negative]
        comment:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - meal
        - rating
        - comment
        - createdAt

    WeeklyReport:
      type: object
      properties:
        totalThisWeek:
          type: integer
        positivePercent:
          type: number
        neutralPercent:
          type: number
        negativePercent:
          type: number
        bestMeal:
          type: string
          nullable: true
        worstMeal:
          type: string
          nullable: true
        recentComments:
          type: array
          items:
            $ref: "#/components/schemas/WeeklyReportComment"
        mealBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/MealStats"
      required:
        - totalThisWeek
        - positivePercent
        - neutralPercent
        - negativePercent
        - bestMeal
        - worstMeal
        - recentComments
        - mealBreakdown

    MealStats:
      type: object
      properties:
        meal:
          type: string
        positive:
          type: integer
        neutral:
          type: integer
        negative:
          type: integer
        total:
          type: integer
      required:
        - meal
        - positive
        - neutral
        - negative
        - total
